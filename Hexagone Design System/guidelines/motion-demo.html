<!DOCTYPE html><html><head><meta charset="utf-8"><title>Entrance patterns</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-950);color:var(--paper-50);font-family:var(--font-sans);padding:22px 24px;box-sizing:border-box}.k{font:500 10px var(--font-mono);color:var(--paper-300)}.n{font:600 11px var(--font-sans);letter-spacing:.04em;text-transform:uppercase}.ltr{display:inline-block;opacity:0;transform:translateY(var(--rise-letter));transition:opacity var(--dur-slow) var(--ease-settle),transform var(--dur-slow) var(--ease-settle)}#t.on .ltr{opacity:1;transform:none}.tile{width:64px;height:64px;background:var(--ink-800);border:1px solid var(--ink-700);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;transition:transform var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard)}.tile span{font:500 18px var(--font-display);color:oklch(68% 0.1 var(--h))}@media (hover:hover){.tile:hover{transform:translateY(-2px);border-color:var(--gold-500)}.tile:hover span{color:var(--gold-500)}}</style></head><body><div style="display:flex;gap:36px;align-items:center"><div id="t" style="font:500 40px var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--gold-500)"></div><div style="display:flex;gap:10px"><div class="tile" style="--h:236"><span>01</span></div><div class="tile" style="--h:272"><span>02</span></div><div class="tile" style="--h:56"><span>03</span></div></div></div><div class="k" style="margin-top:12px">Letters: 20ms stagger, rise .4em, 700ms settle · Card hover: 2px lift + gold border, 180ms</div>
<script>const t=document.getElementById('t');[...'GRANDEUR'].forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.className='ltr';s.style.transitionDelay=(i*20)+'ms';t.appendChild(s)});requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('on')));</script></body></html>
