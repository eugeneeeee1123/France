<!DOCTYPE html><html><head><meta charset="utf-8"><title>Color × type roles</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--ink-950);color:var(--paper-50);font-family:var(--font-sans);padding:22px 24px;box-sizing:border-box}.k{font:500 10px var(--font-mono);color:var(--paper-300)}.n{font:600 11px var(--font-sans);letter-spacing:.04em;text-transform:uppercase}</style></head><body><div style="display:grid;grid-template-columns:150px 1fr;gap:9px 16px;align-items:baseline">

<div class="k">Secondary</div><div style="font-size:13px;color:var(--paper-300)">Paper-300 captions and labels.</div>
<div class="k">Inline link</div><div style="font-size:14px"><a href="#">Gold-500, underline on hover</a></div>
<div class="k">Module label</div><div style="font-size:12px;letter-spacing:.06em;color:var(--mod-arsenal)">Pourquoi · hue for labels/numerals only</div>
