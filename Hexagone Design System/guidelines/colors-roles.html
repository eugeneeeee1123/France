<!-- @dsCard group="Colors" viewport="700x120" name="Text & Surface Roles" subtitle="On-navy vs on-paper text opacities" -->
<link rel="stylesheet" href="../../styles.css">
<div style="display:flex;height:120px;font-family:var(--font-sans-ui)">
<div style="flex:1;background:var(--surface-page);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px">
<span style="color:var(--text-primary);font-size:14px">Primary text on navy</span>
<span style="color:var(--text-muted);font-size:14px">Muted text on navy</span>
<span style="color:var(--text-accent);font-size:14px">Accent (gold) text</span>
</div>
<div style="flex:1;background:var(--surface-paper);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px">
<span style="color:var(--text-primary-on-paper);font-size:14px">Primary text on paper</span>
<span style="color:var(--text-muted-on-paper);font-size:14px">Muted text on paper</span>
</div>
</div>
