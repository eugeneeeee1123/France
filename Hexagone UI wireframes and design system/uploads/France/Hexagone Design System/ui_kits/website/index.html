<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexagone — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../image-slot.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>body{min-width:1280px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./ModuleScreen.jsx"></script>
<script type="text/babel">
const { NavBar, SiteFooter } = window.HexagoneDesignSystem_4acaef;
const STORE = 'hx-kit-route';

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } })();
  const [route, setRoute] = React.useState(saved.route || 'home');
  const [lang, setLang] = React.useState(saved.lang || 'fr');
  const [lastModule, setLastModule] = React.useState(saved.last || 'arsenal');
  const t = window.HX_DATA.DICT[lang];
  React.useEffect(() => { localStorage.setItem(STORE, JSON.stringify({ route, lang, last: lastModule })); document.documentElement.lang = lang; }, [route, lang, lastModule]);
  const go = (k) => { setRoute(k); if (k !== 'home') setLastModule(k); window.scrollTo(0, 0); };
  return (
    <div style={{ background: 'var(--surface-page)', minHeight: '100vh' }}>
      <NavBar modules={window.HX_DATA.MODULES} activeKey={route} homeLabel={t.home} lang={lang} onLangChange={setLang} onNavigate={go} logoSrc="../../assets/editorial/fff-crest.png" logoAlt="FFF" />
      <div key={route + lang} data-screen-label={route === 'home' ? 'Home' : 'Module ' + route}>
        {route === 'home'
          ? <HomeScreen t={t} lastModule={lastModule} onOpen={go} />
          : <ModuleScreen moduleKey={route} t={t} lang={lang} onNavigate={go} />}
      </div>
      <SiteFooter lang={lang} onLangChange={setLang} navLinks={t.footerNav} style={{ marginTop: route === 'home' ? 0 : 0 }} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
